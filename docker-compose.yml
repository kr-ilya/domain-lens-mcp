services:
  domain-lens-mcp:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: domain-lens-mcp:latest
    environment:
      TRANSPORT: http
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      # distroless has no shell or curl, so the binary checks itself.
      test: ["CMD", "/usr/local/bin/domain-lens-mcp", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
